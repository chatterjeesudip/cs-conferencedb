<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Tables</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <h1 class="site-title">Data Tables</h1>
</header>

<main>

  <!-- Tab controls -->
  <div class="tabs" role="tablist" aria-label="Table categories">
    <button class="tab" role="tab" id="tab-btn-1" aria-controls="tab-1" aria-selected="true" data-tab="1">Tab 1</button>
    <button class="tab" role="tab" id="tab-btn-2" aria-controls="tab-2" aria-selected="false" tabindex="-1" data-tab="2">Tab 2</button>
    <button class="tab" role="tab" id="tab-btn-3" aria-controls="tab-3" aria-selected="false" tabindex="-1" data-tab="3">Tab 3</button>
    <button class="tab" role="tab" id="tab-btn-4" aria-controls="tab-4" aria-selected="false" tabindex="-1" data-tab="4">Tab 4</button>
    <button class="tab" role="tab" id="tab-btn-5" aria-controls="tab-5" aria-selected="false" tabindex="-1" data-tab="5">Tab 5</button>
  </div>

  <!-- Tab panels -->
  <!-- Each panel holds one table. Column headers are fixed: H1-H6.
       Replace the placeholder rows with your own data, or duplicate
       a <tr> block to add more rows. -->

  <section class="panel" id="tab-1" role="tabpanel" aria-labelledby="tab-btn-1">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>H1</th><th>H2</th><th>H3</th><th>H4</th><th>H5</th><th>H6</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td data-label="H1">Row 1</td>
            <td data-label="H2">—</td>
            <td data-label="H3">—</td>
            <td data-label="H4">—</td>
            <td data-label="H5">—</td>
            <td data-label="H6">—</td>
          </tr>
          <tr>
            <td data-label="H1">Row 2</td>
            <td data-label="H2">—</td>

            <td data-label="H4">—</td>

            <td data-label="H6">—</td>
          </tr>
          <tr>
            <td data-label="H1">Row 3</td>
            <td data-label="H2">—</td>
            <td data-label="H3">—</td>
            <td data-label="H4">—</td>
            <td data-label="H5">—</td>
            <td data-label="H6">—</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
